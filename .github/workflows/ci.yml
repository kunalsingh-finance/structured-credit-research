name: Research checks

on: [push, pull_request]

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check arithmetic, replay and evidence handling
        run: pip install -r requirements.txt
      - name: Run independent invariant and source adapter tests
        run: python -m unittest discover -s tests -v
      - name: Generate development research pack
        run: python scripts/run_research.py --output-dir output/bounded_fixture
